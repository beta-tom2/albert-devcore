name: ADOS Windows PowerShell 5.1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ados-windows.yml"
      - "*.ps1"
      - "scripts/**"
      - "tests/**"
      - "template/**"
      - "skills/**"
      - ".gitattributes"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ados-windows.yml"
      - "*.ps1"
      - "scripts/**"
      - "tests/**"
      - "template/**"
      - "skills/**"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ados-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell-51:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse PowerShell files
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in @(git ls-files "*.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if (@($parseErrors).Count -gt 0) {
              $failed = $true
              Write-Error "$file`: $((@($parseErrors | ForEach-Object { $_.Message })) -join '; ')"
            }
          }
          if ($failed) { throw 'PowerShell parser errors detected.' }

      - name: Check JavaScript helpers
        shell: powershell
        run: node --check .\scripts\ados-ts-references.js

      - name: Verify manual execution routing
        shell: powershell
        run: .\tests\manual-route.ps1

      - name: Run ADOS smoke test
        shell: powershell
        run: .\tests\ados-smoke.ps1

      - name: Verify project-state export and recovery
        shell: powershell
        run: .\tests\ados-state.ps1

      - name: Verify checkpoint freshness and continuation
        shell: powershell
        run: .\tests\ados-resume.ps1

      - name: Verify project-state publication with a mocked API
        shell: powershell
        run: .\tests\ados-state-publish.ps1

      - name: Verify read-only runtime and skill status
        shell: powershell
        run: .\tests\ados-status.ps1

      - name: Verify queue corruption and lease safety
        shell: powershell
        run: .\tests\ados-queue-safety.ps1

      - name: Verify skill policy and pinned local artifacts
        shell: powershell
        run: .\tests\devcore-skills.ps1

      - name: Verify evidence-backed skill telemetry and legacy calls
        shell: powershell
        run: .\tests\skill-telemetry.ps1

      - name: Verify owned-skill update, conflict checks and restore
        shell: powershell
        run: .\tests\devcore-skills-update.ps1

      - name: Verify project registry normalization
        shell: powershell
        run: .\tests\devcore-registry.ps1

      - name: Verify safe new-project adoption and memory inheritance
        shell: powershell
        run: .\tests\devcore-adoption.ps1

      - name: Confirm clean worktree
        shell: powershell
        run: |
          git diff --check
          $status = @(git status --porcelain=v1)
          if ($status.Count -gt 0) {
            $status | ForEach-Object { Write-Error $_ }
            throw 'Smoke test changed tracked repository files.'
          }
